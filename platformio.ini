[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

board_build.partitions = huge_app.csv

lib_deps =
  https://github.com/T-vK/ESP32-BLE-Keyboard.git
  bodmer/TFT_eSPI @ ^2.5.43
  bodmer/TJpg_Decoder @ ^1.0.8          ; JPEG decode for album art
  bblanchon/ArduinoJson @ ^6.21.5       ; Spotify JSON parsing

build_flags =
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DTFT_BL=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
  -DTOUCH_CS=-1
  ; Give more heap to the main task for HTTP + JSON + JPEG buffers
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192

upload_speed = 921600
monitor_speed = 115200